global:
  scrape_interval: 15s

scrape_configs:
  # node-exporter/cAdvisor chạy mode global và publish cổng kiểu host, nên mỗi
  # node có endpoint riêng -> scrape theo IP host chứ không theo tên service.
  - job_name: node
    static_configs:
      - targets: ["192.168.56.10:9100", "192.168.56.11:9100"]

  - job_name: cadvisor
    static_configs:
      - targets: ["192.168.56.10:8080", "192.168.56.11:8080"]

  # Trạng thái database: số kết nối, ops, uptime của chính MongoDB đang phục vụ app.
  - job_name: mongodb
    static_configs:
      - targets: ["mongodb-exporter:9216"]

  # blackbox đo từ bên ngoài, đi hết đường nginx -> backend, nên phản ánh đúng
  # cái người dùng thấy chứ không chỉ "tiến trình còn sống".
  - job_name: blackbox
    metrics_path: /probe
    params:
      module: [http_2xx]
    static_configs:
      - targets: ["http://frontend:80/", "http://backend:8000/api/health"]
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: blackbox-exporter:9115
