---
# Thứ tự QUAN TRỌNG: manager phải xong trước để worker có token mà join.
- name: Cấu hình chung cho cả 2 node
  hosts: swarm
  gather_facts: true
  roles:
    - common

- name: Khởi tạo swarm ở manager
  hosts: swarm_manager
  gather_facts: false
  roles:
    - swarm_manager

- name: Cho worker join swarm
  hosts: swarm_worker
  gather_facts: false
  roles:
    - swarm_worker

# Chạy SAU khi có image trên GHCR (job build của CI). Role này sinh secret, ghi
# /opt/capstone/.env, đẩy file stack và deploy lần đầu.
- name: Sinh secret và deploy stack
  hosts: swarm_manager
  gather_facts: false
  roles:
    - app

- name: Cài GitHub self-hosted runner trên manager
  hosts: swarm_manager
  gather_facts: false
  roles:
    - runner
