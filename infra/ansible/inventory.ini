# Ansible chạy TỪ TRONG VM manager (provisioner ansible_local của Vagrant) và SSH
# sang cả hai VM bằng khoá lab. Vì control node nằm trong guest nên đường dẫn
# khoá dưới đây là đường dẫn bên trong VM, không phải trên Windows.
[swarm_manager]
swarm_manager ansible_host=192.168.56.10

[swarm_worker]
swarm_worker ansible_host=192.168.56.11

[swarm:children]
swarm_manager
swarm_worker

[swarm:vars]
ansible_user=vagrant
ansible_ssh_private_key_file=/home/vagrant/.ssh/lab_key
ansible_python_interpreter=/usr/bin/python3
ansible_become=true
ansible_become_method=sudo
# Manager chưa từng SSH sang worker nên chưa có host key: bỏ qua xác nhận lần đầu,
# nếu không playbook sẽ dừng chờ trả lời.
ansible_ssh_common_args=-o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null
