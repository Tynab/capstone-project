name: CI/CD

on:
  push:
  # KHÔNG bật `pull_request`: repo này public và có self-hosted runner. Với sự kiện
  # pull_request, workflow lấy từ nhánh của PR — người lạ fork repo rồi sửa file
  # workflow để thêm job chạy trên runner self-hosted là chạy được code tuỳ ý trên
  # VM manager (user ghrunner, group docker = tương đương root, đọc được
  # /opt/capstone/.env). Muốn có CI cho PR thì bật trước: Settings → Actions →
  # "Require approval for all outside collaborators", rồi mới thêm lại dòng này.
  workflow_dispatch:
    inputs:
      image_tag:
        # Chạy tay KHÔNG build gì cả: điền tag thì deploy đúng tag đó (rollback),
        # bỏ trống thì chỉ chạy job test.
        description: "Tag image cần deploy (vd: f692a61) — dùng để rollback. Bỏ trống = chỉ chạy test."
        required: false

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test (e2e API)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json
            e2e/package-lock.json

      # e2e tải binary mongod thật (~80MB) ở lần đầu; cache lại cho các lần sau.
      - name: Cache binary mongod
        uses: actions/cache@v4
        with:
          path: ~/.cache/mongodb-binaries
          key: mongodb-binaries-${{ runner.os }}-${{ hashFiles('e2e/package-lock.json') }}

      - name: Cài dependency
        run: |
          npm ci --prefix backend
          npm ci --prefix frontend
          npm ci --prefix e2e

      # Unit test của backend chạy bằng node --test (không cần service ngoài).
      - name: Unit test backend
        run: npm --prefix backend test

      # Jest của CRA mặc định ở watch mode (treo CI mãi); CI=true bắt chạy một
      # lần rồi thoát, exit 0 khi xanh. Bộ test chốt reducer, lớp api và luồng
      # đăng nhập/thêm task ở tầng component — không cần server thật.
      - name: Unit test frontend
        run: CI=true npm --prefix frontend test

      - name: Chạy e2e tầng API
        run: npm --prefix e2e run test:api

      # Test qua Chrome thật: đây là tầng DUY NHẤT bắt được lỗi app trắng màn hình
      # do lệch hợp đồng backend/frontend (test API vẫn xanh trong ca đó).
      - name: Chạy e2e qua trình duyệt thật
        run: npm --prefix e2e run test:browser
        env:
          # Runner ubuntu-latest có sẵn Chrome ở đường dẫn này.
          CHROME_PATH: /usr/bin/google-chrome

  build:
    name: Build va push image
    needs: test
    # Chỉ build khi mã đã vào main: PR và nhánh phụ chỉ cần test xanh.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.names.outputs.tag }}
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Dang nhap GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Tên image trên GHCR phải viết thường toàn bộ; GitHub trả "Tynab" ở
      # github.repository_owner nên phải hạ chữ thường, không là push sẽ đỏ.
      - name: Tinh ten image
        id: names
        run: |
          owner=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          echo "backend=ghcr.io/${owner}/capstone-project-backend" >> "$GITHUB_OUTPUT"
          echo "frontend=ghcr.io/${owner}/capstone-project-frontend" >> "$GITHUB_OUTPUT"
          echo "tag=$(echo '${{ github.sha }}' | cut -c1-7)" >> "$GITHUB_OUTPUT"

      - name: Build va push backend
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: true
          tags: |
            ${{ steps.names.outputs.backend }}:${{ steps.names.outputs.tag }}
            ${{ steps.names.outputs.backend }}:latest
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend

      - name: Build va push frontend
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: true
          # Đường dẫn tương đối: request /api đi qua nginx của chính container.
          build-args: |
            REACT_APP_API_URL=/api
          tags: |
            ${{ steps.names.outputs.frontend }}:${{ steps.names.outputs.tag }}
            ${{ steps.names.outputs.frontend }}:latest
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend

  deploy:
    name: Deploy len swarm
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    # Runner self-hosted nằm TRONG VM manager: GitHub-hosted runner không nhìn
    # thấy IP host-only 192.168.56.x, còn runner này vừa kéo được image vừa gọi
    # được docker tại chỗ.
    runs-on: [self-hosted, swarm-manager]
    # timeout-minutes chỉ đếm khi job ĐÃ BẮT ĐẦU chạy (chặn ca deploy.sh treo).
    # Runner offline thì job nằm ở trạng thái queued và KHÔNG bị huỷ bởi dòng này —
    # GitHub chỉ tự huỷ job queued sau ~24h. Xem mục xử lý sự cố trong infra/README.md.
    timeout-minutes: 15
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    steps:
      - name: Deploy tag vừa build
        run: /opt/capstone/deploy.sh "${{ needs.build.outputs.tag }}"

  deploy-manual:
    name: Deploy thu cong (rollback)
    if: github.event_name == 'workflow_dispatch' && inputs.image_tag != ''
    runs-on: [self-hosted, swarm-manager]
    timeout-minutes: 15
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    steps:
      - name: Deploy tag duoc chon
        run: /opt/capstone/deploy.sh "${{ inputs.image_tag }}"
