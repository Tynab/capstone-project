name: CI/CD

on:
  push:
  # KHÔNG bật `pull_request`: repo này public và có self-hosted runner. Với sự kiện
  # pull_request, workflow lấy từ nhánh của PR — người lạ fork repo rồi sửa file
  # workflow để thêm job chạy trên runner self-hosted là chạy được code tuỳ ý trên
  # VM manager (user ghrunner, group docker = tương đương root, đọc được
  # /opt/capstone/.env). Muốn có CI cho PR thì bật trước: Settings → Actions →
  # "Require approval for all outside collaborators", rồi mới thêm lại dòng này.
  # Chạy tay = chỉ chạy job test (build/deploy chỉ chạy khi push lên main).
  # Rollback KHÔNG còn ở đây mà ở workflow Deploy (deploy.yml) — xem ghi chú cuối file.
  workflow_dispatch:

# Push mới huỷ push cũ cùng nhánh (đỡ tốn phút chạy). Lần chạy tay (workflow_dispatch =
# chỉ test) có nhóm RIÊNG: nếu chung nhóm, nó huỷ run push đang chạy trên main thành
# `cancelled` (badge "failing") và commit đó không được build/deploy tới lần push sau, vì
# run chạy tay không build. Push GIỮ đúng tên nhóm cũ `ci-<ref>`: push đầu tiên sau khi tách
# deploy phải còn huỷ được run cũ đang kẹt ở job deploy (nếu không, run đó chờ ~24h rồi
# kết thúc failed và kéo badge đỏ lại).
concurrency:
  group: ${{ github.event_name == 'workflow_dispatch' && format('ci-{0}-dispatch', github.ref) || format('ci-{0}', github.ref) }}
  cancel-in-progress: true

jobs:
  test:
    name: Test (e2e API)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Node 24 (LTS hiện tại) chứ không phải 20, vì hai lý do cụ thể:
      # - Vitest 5 (bộ test frontend) khai engines: ^22.12.0 || ^24.0.0 — Node 20
      #   không chạy được nó.
      # - Trùng major với máy dev để tránh bẫy đã gặp thật: lockfile sinh bằng npm 11
      #   (Node 24) bị npm 10 (Node 20) từ chối ở bước `npm ci`.
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json
            e2e/package-lock.json

      # e2e tải binary mongod thật (~80MB) ở lần đầu; cache lại cho các lần sau.
      - name: Cache binary mongod
        uses: actions/cache@v4
        with:
          path: ~/.cache/mongodb-binaries
          key: mongodb-binaries-${{ runner.os }}-${{ hashFiles('e2e/package-lock.json') }}

      - name: Cài dependency
        run: |
          npm ci --prefix backend
          npm ci --prefix frontend
          npm ci --prefix e2e

      # Unit test của backend chạy bằng node --test (không cần service ngoài).
      - name: Unit test backend
        run: npm --prefix backend test

      # Vitest chạy một lần rồi thoát (`vitest run`), không có watch mode như jest
      # của CRA nên không cần CI=true. Bộ test chốt reducer, lớp api và luồng
      # đăng nhập/thêm task ở tầng component — không cần server thật.
      - name: Unit test frontend
        run: npm --prefix frontend test

      # Vite KHÔNG chạy ESLint trong lúc build (CRA thì có, build đỏ nếu lint lỗi),
      # nên lint phải là bước riêng — thiếu bước này là mất lưới lint mà không ai thấy.
      - name: Lint frontend
        run: npm --prefix frontend run lint

      - name: Chạy e2e tầng API
        run: npm --prefix e2e run test:api

      # Test qua Chrome thật: đây là tầng DUY NHẤT bắt được lỗi app trắng màn hình
      # do lệch hợp đồng backend/frontend (test API vẫn xanh trong ca đó).
      - name: Chạy e2e qua trình duyệt thật
        run: npm --prefix e2e run test:browser
        env:
          # Runner ubuntu-latest có sẵn Chrome ở đường dẫn này.
          CHROME_PATH: /usr/bin/google-chrome

  build:
    name: Build va push image
    needs: test
    # Chỉ build khi mã đã vào main: PR và nhánh phụ chỉ cần test xanh.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Dang nhap GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Tên image trên GHCR phải viết thường toàn bộ; GitHub trả "Tynab" ở
      # github.repository_owner nên phải hạ chữ thường, không là push sẽ đỏ.
      - name: Tinh ten image
        id: names
        run: |
          owner=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          echo "backend=ghcr.io/${owner}/capstone-project-backend" >> "$GITHUB_OUTPUT"
          echo "frontend=ghcr.io/${owner}/capstone-project-frontend" >> "$GITHUB_OUTPUT"
          echo "tag=$(echo '${{ github.sha }}' | cut -c1-7)" >> "$GITHUB_OUTPUT"

      - name: Build va push backend
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: true
          tags: |
            ${{ steps.names.outputs.backend }}:${{ steps.names.outputs.tag }}
            ${{ steps.names.outputs.backend }}:latest
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend

      - name: Build va push frontend
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: true
          # Đường dẫn tương đối: request /api đi qua nginx của chính container.
          build-args: |
            VITE_API_URL=/api
          tags: |
            ${{ steps.names.outputs.frontend }}:${{ steps.names.outputs.tag }}
            ${{ steps.names.outputs.frontend }}:latest
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend


# ------------------------------------------------------------------ deploy
# Deploy và rollback nằm ở workflow riêng: .github/workflows/deploy.yml (chạy bằng
# workflow_run sau khi workflow này xanh trên main). Vì sao tách: job deploy chạy trên
# runner self-hosted trong VM manager — VM tắt là runner offline và job nằm `queued`
# tới ~24h. Khi deploy còn chung workflow, cả run CI/CD đứng theo nó; push kế tiếp huỷ
# run cũ (concurrency ở trên) thành `cancelled` và badge CI/CD trên README báo
# "failing" dù test + build đều xanh — đã gặp thật ngày 2026-11-26 (run 07:33 và 07:42
# bị huỷ khi đang chờ runner, run 07:44 treo ở deploy). Tách ra thì badge này chỉ phản
# ánh test + build; deploy chờ runner riêng, không kéo run CI/CD theo.
#
# deploy.yml tính lại tag từ head_sha theo ĐÚNG quy tắc 7 ký tự ở bước "Tinh ten image"
# phía trên — đổi quy tắc đặt tag ở đây thì phải đổi cả bên đó.
