server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # BrowserRouter: F5 ở /active hay /resetPassword phải trả về index.html,
    # nếu không nginx trả 404 và người dùng mất trang.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cùng origin với trang -> không còn CORS, không còn REACT_APP_API_URL trỏ
    # sai máy người dùng.
    #
    # Tên service được phân giải LÚC REQUEST chứ không phải lúc nginx khởi động:
    # `backend` chỉ tồn tại trên overlay network của swarm, và nginx sẽ thoát ngay
    # khi boot nếu không resolve được ("host not found in upstream") — đã gặp thật
    # khi chạy thử container đơn lẻ. 127.0.0.11 là DNS nội bộ của Docker.
    location /api/ {
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $backend_upstream http://backend:8000;
        proxy_pass $backend_upstream$request_uri;
        proxy_set_header Host $host;
        # Backend đặt TRUST_PROXY=1 nên rate limit đọc đúng IP client từ header này.
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Asset của CRA có hash trong tên -> cache dài, an toàn.
    location ~* \.(?:js|css|png|jpg|svg|ico|woff2?)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }
}
