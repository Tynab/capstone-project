server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # BrowserRouter: F5 ở /active hay /resetPassword phải trả về index.html,
    # nếu không nginx trả 404 và người dùng mất trang.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cùng origin với trang -> không còn CORS, không còn REACT_APP_API_URL trỏ
    # sai máy người dùng. proxy_pass KHÔNG có phần path để giữ nguyên /api/...
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        # Backend đặt TRUST_PROXY=1 nên rate limit đọc đúng IP client từ header này.
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Asset của CRA có hash trong tên -> cache dài, an toàn.
    location ~* \.(?:js|css|png|jpg|svg|ico|woff2?)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }
}
