server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # IP thật của khách khi request đi qua Cloudflare Tunnel.
    # Chỉ tin CF-Connecting-IP khi peer nằm trong dải overlay của swarm (10.0.0.0/8 —
    # cloudflared là container cùng overlay, đo thật trong lab: 10.0.1.8). Cloudflare
    # chính là bên ghi header này; client tự gửi header thì Cloudflare không chuyển
    # tiếp nguyên trạng. Xem docs/superpowers/specs/2026-10-16-cloudflare-tunnel-portainer-design.md mục 6.
    set_real_ip_from 10.0.0.0/8;
    real_ip_header CF-Connecting-IP;
    real_ip_recursive off;

    # BrowserRouter: F5 ở /active hay /resetPassword phải trả về index.html,
    # nếu không nginx trả 404 và người dùng mất trang.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cùng origin với trang -> không còn CORS, không còn REACT_APP_API_URL trỏ
    # sai máy người dùng.
    #
    # Tên service được phân giải LÚC REQUEST chứ không phải lúc nginx khởi động:
    # `backend` chỉ tồn tại trên overlay network của swarm, và nginx sẽ thoát ngay
    # khi boot nếu không resolve được ("host not found in upstream") — đã gặp thật
    # khi chạy thử container đơn lẻ. 127.0.0.11 là DNS nội bộ của Docker.
    location /api/ {
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $backend_upstream http://backend:8000;
        proxy_pass $backend_upstream$request_uri;
        proxy_set_header Host $host;
        # Ghi ĐÈ hẳn XFF bằng $remote_addr (sau real_ip chính là IP khách).
        # $proxy_add_x_forwarded_for sẽ NỐI THÊM IP của chính nginx, làm backend
        # (TRUST_PROXY=1) tưởng mọi request đến từ container cloudflared -> rate
        # limit gộp một bucket cho tất cả người dùng Internet (đo thật: peer 10.0.1.8).
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Asset của CRA có hash trong tên -> cache dài, an toàn.
    location ~* \.(?:js|css|png|jpg|svg|ico|woff2?)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }
}
