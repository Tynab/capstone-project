server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # ---------------------------- header bảo mật ----------------------------
    # App đăng nhập bằng JWT lưu trong localStorage, nên một lỗi XSS là mất token —
    # CSP là lưới chặn thứ hai. CSP đặt CHẶT ở đây được vì frontend đã tự host cả font
    # Poppins lẫn hai ảnh minh hoạ, không còn nguồn ngoài nào (trước đây phải @import
    # fonts.googleapis.com và lấy ảnh từ mdbcdn). Đổi lại: thêm bất kỳ nguồn ngoài nào
    # (CDN, font, analytics) là PHẢI mở CSP tương ứng, nếu không trình duyệt chặn im lặng.
    #   img-src data: vì một số icon SVG inline dùng data-URI.
    # HSTS KHÔNG đặt ở đây — nginx phục vụ HTTP, TLS do Cloudflare lo, nên bật ở
    # dashboard Cloudflare (SSL/TLS -> Edge Certificates -> HSTS). Xem infra/README.md.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self'; connect-src 'self'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'; object-src 'none'" always;

    # IP thật của khách khi request đi qua Cloudflare Tunnel.
    # Chỉ tin CF-Connecting-IP khi peer nằm trong dải overlay của swarm (10.0.0.0/8 —
    # cloudflared là container cùng overlay, đo thật trong lab: 10.0.1.8). Cloudflare
    # chính là bên ghi header này; client tự gửi header thì Cloudflare không chuyển
    # tiếp nguyên trạng. Xem docs/superpowers/specs/2026-10-16-cloudflare-tunnel-portainer-design.md mục 6.
    set_real_ip_from 10.0.0.0/8;
    real_ip_header CF-Connecting-IP;
    real_ip_recursive off;

    # BrowserRouter: F5 ở /active hay /resetPassword phải trả về index.html,
    # nếu không nginx trả 404 và người dùng mất trang.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cùng origin với trang -> không còn CORS, không còn REACT_APP_API_URL trỏ
    # sai máy người dùng.
    #
    # Tên service được phân giải LÚC REQUEST chứ không phải lúc nginx khởi động:
    # `backend` chỉ tồn tại trên overlay network của swarm, và nginx sẽ thoát ngay
    # khi boot nếu không resolve được ("host not found in upstream") — đã gặp thật
    # khi chạy thử container đơn lẻ. 127.0.0.11 là DNS nội bộ của Docker.
    # `^~` là CỐ Ý: nginx xét location regex TRƯỚC prefix thường, nên nếu để
    # `location /api/` trần thì một route API có đuôi .js/.css/.png (ví dụ
    # /api/export/report.json) sẽ bị khối asset bên dưới cướp và trả file tĩnh
    # thay vì proxy sang backend. Hôm nay chưa có route nào như vậy, nhưng lỗi
    # kiểu này chỉ nổ đúng với một số đuôi nhất định nên rất khó chẩn đoán.
    location ^~ /api/ {
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $backend_upstream http://backend:8000;
        proxy_pass $backend_upstream$request_uri;
        proxy_set_header Host $host;
        # Ghi ĐÈ hẳn XFF bằng $remote_addr (sau real_ip chính là IP khách).
        # $proxy_add_x_forwarded_for sẽ NỐI THÊM IP của chính nginx, làm backend
        # (TRUST_PROXY=1) tưởng mọi request đến từ container cloudflared -> rate
        # limit gộp một bucket cho tất cả người dùng Internet (đo thật: peer 10.0.1.8).
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Asset do Vite sinh ra nằm trong /assets/ và CÓ hash trong tên -> cache dài, an toàn.
    # `^~` để prefix này thắng regex bên dưới, nếu không regex sẽ cướp và chỉ cache 1 ngày.
    location ^~ /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        # nginx KHÔNG thừa kế add_header của server khi location đã có add_header riêng
        # (đây là cái bẫy của add_header) — nhắc lại nosniff, nếu không nhóm asset này mất.
        add_header X-Content-Type-Options "nosniff" always;
    }

    # File tĩnh KHÔNG có hash (favicon.ico, logo192.png, manifest.json trong public/)
    # -> cache ngắn thôi. Trước đây một regex gộp chung gắn `immutable` 30 ngày cho cả
    # nhóm này: thay favicon/logo sau đó thì trình duyệt giữ bản cũ suốt 30 ngày mà
    # không có cách nào ép tải lại ngoài việc đổi tên file.
    location ~* \.(?:js|css|png|jpg|jpeg|svg|ico|woff2?|webp|json|txt)$ {
        expires 1d;
        add_header Cache-Control "public";
        add_header X-Content-Type-Options "nosniff" always;
    }
}
